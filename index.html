<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的記帳（固定支出繳納次數完整版）</title>

<style>
:root{
  --bg:#0b1020; --card:#121a33; --text:#e9eeff; --muted:#aab3d6;
  --line:#243055; --accent:#7aa2ff; --danger:#ff6b6b; --ok:#7dffb2;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,"Noto Sans TC",sans-serif;background:#0b1020;color:var(--text)}
.wrap{max-width:1100px;margin:auto;padding:16px}
h1{font-size:20px;margin:0}
h2{font-size:16px;margin:8px 0}
.small{font-size:12px;color:var(--muted)}
.card{background:#121a33;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
input,textarea,select,button{
  width:100%;padding:10px;border-radius:10px;
  border:1px solid var(--line);background:#0c1430;color:var(--text)
}
textarea{resize:vertical}
button{cursor:pointer}
.btn{background:var(--accent);color:#06102b;font-weight:800}
.btn-ghost{background:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{padding:8px;border-bottom:1px solid var(--line);font-size:13px}
.right{text-align:right}
</style>
</head>

<body>
<div class="wrap">
<h1>📒 我的記帳</h1>

<!-- 餘額 -->
<div class="card">
  <h2>即時餘額</h2>
  <div class="row">
    <input id="bal_month" type="month">
    <input id="bal_start" type="number" placeholder="起始餘額">
  </div>
  <h2 id="bal_now">0</h2>
</div>

<!-- 固定支出 -->
<div class="card">
<h2>固定支出 / 貸款</h2>

<input id="fx_name" placeholder="名稱（學貸 / 房租）">
<input id="fx_amt" type="number" placeholder="每月金額">
<div class="row">
  <input id="fx_day" type="number" placeholder="繳費日">
  <input id="fx_acct" placeholder="銀行帳戶">
</div>
<textarea id="fx_note" placeholder="備註"></textarea>
<button class="btn" id="fx_save">新增固定支出</button>

<table>
<thead>
<tr>
  <th>名稱</th>
  <th class="right">金額</th>
  <th>狀態</th>
  <th></th>
</tr>
</thead>
<tbody id="fx_list"></tbody>
</table>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
const KEY="fix_full_v2";
const load=()=>JSON.parse(localStorage.getItem(KEY)||"[]");
const save=v=>localStorage.setItem(KEY,JSON.stringify(v));
const ym=()=>new Date().toISOString().slice(0,7);

bal_month.value=ym();
let editId=null;

/* 固定支出渲染 */
function render(){
 let sum=0, tb=fx_list; tb.innerHTML="";
 load().forEach(x=>{
   const paidThisMonth=x.paidYms.includes(bal_month.value);
   if(x.enabled && paidThisMonth) sum+=x.amt;
   tb.insertAdjacentHTML("beforeend",`
   <tr>
     <td>
       ${x.name}
       <div class="small">${x.note||""}</div>
       <div class="small">已繳 ${x.paidYms.length} 次</div>
     </td>
     <td class="right">${x.amt}</td>
     <td>
       ${x.enabled?"啟用":"停用"} /
       ${paidThisMonth?"已繳":"未繳"}
     </td>
     <td>
       <button onclick="togglePaid('${x.id}')">☑️</button>
       <button onclick="toggleEnabled('${x.id}')">⏸️</button>
       <button onclick="editFix('${x.id}')">✏️</button>
       <button onclick="delFix('${x.id}')">🗑️</button>
     </td>
   </tr>`);
 });
 bal_now.textContent=(+bal_start.value||0)-sum;
}

/* 操作 */
function togglePaid(id){
 let arr=load();
 let x=arr.find(i=>i.id===id);
 const m=bal_month.value;
 if(x.paidYms.includes(m)){
   x.paidYms=x.paidYms.filter(v=>v!==m);
 }else{
   x.paidYms.push(m);
 }
 save(arr); render();
}
function toggleEnabled(id){
 let arr=load();
 let x=arr.find(i=>i.id===id);
 x.enabled=!x.enabled;
 save(arr); render();
}
function editFix(id){
 let x=load().find(i=>i.id===id);
 editId=id;
 fx_name.value=x.name;
 fx_amt.value=x.amt;
 fx_day.value=x.day;
 fx_acct.value=x.acct;
 fx_note.value=x.note;
 fx_save.textContent="更新固定支出";
}
function delFix(id){
 save(load().filter(x=>x.id!==id));
 render();
}

fx_save.onclick=()=>{
 let arr=load();
 if(editId){
   let i=arr.findIndex(x=>x.id===editId);
   arr[i]={...arr[i],
     name:fx_name.value,amt:+fx_amt.value,
     day:fx_day.value,acct:fx_acct.value,note:fx_note.value};
   editId=null;
   fx_save.textContent="新增固定支出";
 }else{
   arr.push({
     id:Date.now()+"",
     name:fx_name.value,
     amt:+fx_amt.value,
     day:fx_day.value,
     acct:fx_acct.value,
     note:fx_note.value,
     enabled:true,
     paidYms:[]
   });
 }
 save(arr);
 fx_name.value=fx_amt.value=fx_day.value=fx_acct.value=fx_note.value="";
 render();
};

bal_month.onchange=render;
bal_start.oninput=render;
render();
</script>
</body>
</html>
