<!doctype html>
<html lang="zh-Hant">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>記帳整合版（穩定版含統計）</title>
<style>
  :root{
    --bg:#0b1020; --card:#121a33; --text:#e9eeff; --muted:#aab3d6;
    --line:#243055; --accent:#7aa2ff; --danger:#ff6b6b; --ok:#7dffb2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",system-ui,sans-serif;background:linear-gradient(180deg,#070b17,#0b1020);color:var(--text)}
  .wrap{max-width:1120px;margin:0 auto;padding:16px}
  h1{margin:0 0 6px;font-size:20px}
  h2{margin:0 0 10px;font-size:16px}
  .muted{color:var(--muted);font-size:12px}
  .card{background:rgba(18,26,51,.88);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 6px}
  input,select,textarea,button{
    width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0c1430;color:var(--text);outline:none
  }
  textarea{min-height:70px;resize:vertical}
  button{cursor:pointer}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
  @media(max-width:720px){.row,.row3{grid-template-columns:1fr}}
  .btn{background:var(--accent);color:#06102b;font-weight:900;border:1px solid transparent}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--text)}
  .btn-danger{background:transparent;border-color:rgba(255,107,107,.55);color:var(--danger)}
  .kpi{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px;border-radius:12px;border:1px dashed rgba(122,162,255,.35);background:rgba(122,162,255,.08)}
  .kpi strong{font-size:22px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{color:var(--muted);font-weight:600;text-align:left}
  .right{text-align:right}
  .small{font-size:11px;color:var(--muted);line-height:1.45}
  .ok{color:var(--ok);font-weight:900}
  .warn{color:#ffd27a;font-weight:900}

  /* Pure CSS Tabs (iPhone stable) */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 14px}
  .tabs label{
    padding:9px 12px;border-radius:999px;border:1px solid var(--line);
    background:rgba(255,255,255,.02);color:var(--text);cursor:pointer;user-select:none
  }
  input[name="tab"]{
    position:fixed;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;
  }
  #t-exp:checked ~ .tabs label[for="t-exp"],
  #t-inc:checked ~ .tabs label[for="t-inc"],
  #t-fix:checked ~ .tabs label[for="t-fix"],
  #t-rep:checked ~ .tabs label[for="t-rep"],
  #t-set:checked ~ .tabs label[for="t-set"],
  #t-bak:checked ~ .tabs label[for="t-bak"]{
    border-color:rgba(122,162,255,.7);background:rgba(122,162,255,.12)
  }
  .panel{display:none}
  #t-exp:checked ~ .panels #p-exp{display:block}
  #t-inc:checked ~ .panels #p-inc{display:block}
  #t-fix:checked ~ .panels #p-fix{display:block}
  #t-rep:checked ~ .panels #p-rep{display:block}
  #t-set:checked ~ .panels #p-set{display:block}
  #t-bak:checked ~ .panels #p-bak{display:block}

  .inlineBtns{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-block;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.02);font-size:11px;color:var(--muted)}
</style>
</head>

<body>
<div class="wrap">
  <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-end;flex-wrap:wrap;">
    <div>
      <h1>記帳整合版（穩定版）</h1>
      <div class="muted">若你剛剛遇到「按鈕都按不了」，通常是 script 壞掉；這版不靠外部套件，先確保所有新增/編輯可用。</div>
    </div>
    <span class="pill" id="pill_state">載入中…</span>
  </div>

  <div class="card">
    <h2>即時餘額</h2>
    <div class="row">
      <div>
        <label>月份</label>
        <input id="month" type="month">
      </div>
      <div>
        <label>起始餘額</label>
        <input id="start_balance" type="number" placeholder="例如 20000">
      </div>
    </div>
    <div class="kpi" style="margin-top:12px">
      <div>
        <div class="muted">本月餘額</div>
        <strong id="bal_now">0</strong>
        <div class="small" id="bal_breakdown"></div>
      </div>
      <div id="bal_state"></div>
    </div>
  </div>

  <input id="t-exp" type="radio" name="tab" checked>
  <input id="t-inc" type="radio" name="tab">
  <input id="t-fix" type="radio" name="tab">
  <input id="t-rep" type="radio" name="tab">
  <input id="t-set" type="radio" name="tab">
  <input id="t-bak" type="radio" name="tab">

  <div class="tabs">
    <label for="t-exp">支出</label>
    <label for="t-inc">收入</label>
    <label for="t-fix">固定支出</label>
    <label for="t-rep">報表</label>
    <label for="t-set">設定</label>
    <label for="t-bak">備份</label>
  </div>

  <div class="panels">

    <div id="p-exp" class="panel card">
      <h2>支出</h2>
      <div class="row">
        <div>
          <label>日期</label>
          <input id="ex_date" type="date">
        </div>
        <div>
          <label>金額</label>
          <input id="ex_amt" type="number" placeholder="例如 120">
        </div>
      </div>
      <label>備註（用於品項統計）</label>
      <input id="ex_note" placeholder="例如 午餐 / 咖啡 / 交通">

      <div class="inlineBtns" style="margin-top:10px">
        <button class="btn" id="ex_save" type="button">新增支出</button>
        <button class="btn-ghost" id="ex_cancel" type="button" style="display:none">取消編輯</button>
      </div>

      <table>
        <thead><tr><th>日期</th><th>備註</th><th class="right">金額</th><th class="right">操作</th></tr></thead>
        <tbody id="ex_list"></tbody>
      </table>
    </div>

    <div id="p-inc" class="panel card">
      <h2>收入</h2>

      <label>收入類型</label>
      <select id="in_type">
        <option value="shopee">蝦皮（每月合併，工時計算）</option>
        <option value="other">其他收入（直接金額，多筆）</option>
      </select>

      <div id="box_shopee">
        <div class="row3">
          <div>
            <label>本月總工時</label>
            <input id="sh_hours" type="number" placeholder="例如 60">
          </div>
          <div>
            <label>獎金（可空白）</label>
            <input id="sh_bonus" type="number" placeholder="例如 500">
          </div>
          <div>
            <label>時薪（預設 205）</label>
            <input id="sh_rate" type="number" placeholder="205">
          </div>
        </div>
        <div class="small" id="sh_preview" style="margin-top:8px"></div>
      </div>

      <div id="box_other" style="display:none">
        <div class="row">
          <div>
            <label>金額</label>
            <input id="ot_amt" type="number" placeholder="例如 3000">
          </div>
          <div>
            <label>標籤（可選）</label>
            <input id="ot_tag" placeholder="例如 家教 / 接案">
          </div>
        </div>
      </div>

      <label>備註</label>
      <input id="in_note" placeholder="例如 本月薪資 / 現金收入">

      <div class="inlineBtns" style="margin-top:10px">
        <button class="btn" id="in_save" type="button">新增收入</button>
        <button class="btn-ghost" id="in_cancel" type="button" style="display:none">取消編輯</button>
      </div>

      <table>
        <thead><tr><th>類型</th><th>備註</th><th class="right">實領</th><th class="right">操作</th></tr></thead>
        <tbody id="in_list"></tbody>
      </table>
    </div>

    <div id="p-fix" class="panel card">
      <h2>固定支出 / 貸款</h2>
      <div class="row">
        <div>
          <label>名稱</label>
          <input id="fx_name" placeholder="例如 學貸 / 房租">
        </div>
        <div>
          <label>每月金額</label>
          <input id="fx_amt" type="number" placeholder="例如 3500">
        </div>
      </div>
      <div class="row">
        <div>
          <label>繳費日（可空白）</label>
          <input id="fx_day" type="number" placeholder="例如 10">
        </div>
        <div>
          <label>銀行帳戶（可空白）</label>
          <input id="fx_acct" placeholder="可貼上帳號，之後可複製">
        </div>
      </div>
      <label>備註</label>
      <textarea id="fx_note" placeholder="例如 期限 / 銀行名稱"></textarea>

      <div class="inlineBtns" style="margin-top:10px">
        <button class="btn" id="fx_save" type="button">新增固定支出</button>
        <button class="btn-ghost" id="fx_cancel" type="button" style="display:none">取消編輯</button>
      </div>

      <table>
        <thead><tr><th>名稱</th><th class="right">金額</th><th>狀態</th><th class="right">操作</th></tr></thead>
        <tbody id="fx_list"></tbody>
      </table>
      <div class="small" style="margin-top:10px">本月勾「已繳」才扣入餘額；每筆會顯示「已繳 X 次」。</div>
    </div>

    <div id="p-rep" class="panel card">
      <h2>報表（本月）</h2>
      <div class="small" id="rep_summary"></div>

      <div class="card" style="margin-top:12px">
        <h2 style="margin:0 0 8px">消費品項統計（依支出備註）</h2>
        <table>
          <thead>
            <tr>
              <th>排名</th>
              <th>品項</th>
              <th class="right">次數</th>
              <th class="right">總金額</th>
              <th class="right">佔比</th>
            </tr>
          </thead>
          <tbody id="item_table"></tbody>
        </table>
        <div class="small" id="item_note" style="margin-top:8px"></div>
      </div>
    </div>

    <div id="p-set" class="panel card">
      <h2>設定（蝦皮扣款預設）</h2>
      <div class="small">先用預設值；之後要對齊薪資單可再調。</div>

      <div class="row3">
        <div>
          <label>勞保普通事故費率</label>
          <input id="s_labor_rate" type="number" step="0.0001">
        </div>
        <div>
          <label>就保費率</label>
          <input id="s_emp_rate" type="number" step="0.0001">
        </div>
        <div>
          <label>勞工自付比例</label>
          <input id="s_worker_share" type="number" step="0.0001">
        </div>
      </div>
      <div class="row3">
        <div>
          <label>團保（月額）</label>
          <input id="s_group_monthly" type="number">
        </div>
        <div>
          <label>團保滿月工時</label>
          <input id="s_group_full_hours" type="number">
        </div>
        <div>
          <label>行政費（每月）</label>
          <input id="s_admin_fee" type="number">
        </div>
      </div>

      <button class="btn" id="save_settings" type="button" style="margin-top:10px">儲存設定</button>
    </div>

    <div id="p-bak" class="panel card">
      <h2>備份 / 還原</h2>
      <div class="inlineBtns" style="margin-top:10px">
        <button class="btn" id="btn_export" type="button">匯出 JSON</button>
        <button class="btn-ghost" id="btn_import" type="button">匯入 JSON</button>
      </div>
      <input id="import_file" type="file" accept="application/json" style="display:none">
      <div class="card" style="margin-top:12px">
        <h2 style="margin:0 0 8px">危險區（清空資料）</h2>
        <button class="btn-danger" id="btn_clear" type="button" style="margin-top:10px">清空整合版資料</button>
      </div>
    </div>

  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const KEY = {
    EXP: "app_expenses_v3",
    INC: "app_incomes_v3",
    FIX: "app_fixed_v3",
    SET: "app_settings_v3",
    START: "app_start_balance_by_month_v3",
    MIG: "app_migrated_v3"
    CAT: "app_category_rules_v1",
  };

  const nowYM = () => new Date().toISOString().slice(0,7);
  const todayISO = () => new Date().toISOString().slice(0,10);
  const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2,8));
  const money = (n) => String(Math.round(Number(n || 0)));

  const load = (k, fallback) => {
    try { return JSON.parse(localStorage.getItem(k) || JSON.stringify(fallback)); }
    catch { return fallback; }
  };
  const save = (k, v) => localStorage.setItem(k, JSON.stringify(v));

  const defaultSettings = {
    labor_rate: 0.115,
    emp_rate: 0.01,
    worker_share: 0.2,
    group_monthly: 210,
    group_full_hours: 160,
    admin_fee: 30
  };

  function loadSettings() {
    const s = load(KEY.SET, null) || {};
    const merged = { ...defaultSettings, ...s };
    save(KEY.SET, merged);
    return merged;
  }

  function calcShopee(hours, bonus, rate, s) {
    const h = Number(hours || 0);
    const b = Number(bonus || 0);
    const r = Number(rate || 205);
    const gross = h * r + b;
    const base = gross;
    const labor = Math.round(base * s.labor_rate * s.worker_share);
    const emp = Math.round(base * s.emp_rate * s.worker_share);
    const group = Math.round(s.group_monthly * (h / s.group_full_hours));
    const admin = Math.round(s.admin_fee);
    const net = Math.round(gross - labor - emp - group - admin);
    return { gross: Math.round(gross), labor, emp, group, admin, net };
  }

  // ---- migration from older keys used in this conversation ----
  function migrateOnce() {
    const already = load(KEY.MIG, false);
    if (already) return "已完成搬移/或已使用整合版";

    const hasNew = load(KEY.EXP, []).length || load(KEY.INC, []).length || load(KEY.FIX, []).length;
    if (hasNew) { save(KEY.MIG, true); return "整合版已有資料"; }

    const pull = (k) => (Array.isArray(load(k, [])) ? load(k, []) : []);

    const expKeys = ["exp_s15","exp_s1","exp_v1","exp_all_v2"];
    const incKeys = ["inc_s15","inc_s1","inc_v1","inc_all_v2"];
    const fixKeys = ["fix_s15","fix_full_v2","fix_all_v2"];

    let ex = [], inc = [], fix = [];
    expKeys.forEach(k => ex.push(...pull(k)));
    incKeys.forEach(k => inc.push(...pull(k)));
    fixKeys.forEach(k => fix.push(...pull(k)));

    const exN = ex.map(x => ({
      id: String(x.id || uid()),
      ym: x.ym || (x.date ? String(x.date).slice(0,7) : nowYM()),
      date: x.date || todayISO(),
      amt: Math.round(Number(x.amt || 0)),
      note: String(x.note || "")
    }));

    const incN = inc.map(x => ({
      id: String(x.id || uid()),
      ym: x.ym || nowYM(),
      typeKey: x.typeKey || (x.type === "蝦皮" ? "shopee" : "other"),
      type: (x.typeKey === "shopee" || x.type === "蝦皮") ? "蝦皮" : "其他",
      amt: Math.round(Number(x.amt || 0)),
      hours: Number(x.hours || 0),
      bonus: Number(x.bonus || 0),
      rate: Number(x.rate || 205),
      tag: String(x.tag || ""),
      note: String(x.note || ""),
      breakdown: x.breakdown
    }));

    const fixN = fix.map(x => {
      const paidYms = Array.isArray(x.paidYms) ? x.paidYms.map(String)
                    : (typeof x.paidYm === "string" && x.paidYm ? [String(x.paidYm)] : []);
      return {
        id: String(x.id || uid()),
        name: String(x.name || ""),
        amt: Math.round(Number(x.amt || 0)),
        day: String(x.day || ""),
        acct: String(x.acct || ""),
        note: String(x.note || ""),
        enabled: x.enabled === undefined ? true : !!x.enabled,
        paidYms: [...new Set(paidYms)].sort()
      };
    }).filter(x => x.name);

    save(KEY.EXP, exN);
    save(KEY.INC, incN);
    save(KEY.FIX, fixN);
    if (!load(KEY.SET, null)) save(KEY.SET, defaultSettings);

    save(KEY.MIG, true);
    return `已搬移：支出 ${exN.length} / 收入 ${incN.length} / 固定 ${fixN.length}`;
  }

  // ---- state ----
  let editExpId = null;
  let editIncId = null;
  let editFixId = null;

  function getYM() { return $("month").value; }

  function loadStartMap() { return load(KEY.START, {}); }
  function setStartForMonth(ym, v) {
    const m = loadStartMap();
    m[ym] = Number(v || 0);
    save(KEY.START, m);
  }
  function restoreStartForMonth() {
    const ym = getYM();
    const m = loadStartMap();
    $("start_balance").value = (m[ym] === undefined) ? "" : m[ym];
  }

  // ---- expense ----
  function renderExpenses() {
    const ym = getYM();
    const items = load(KEY.EXP, []).filter(x => x.ym === ym).sort((a,b)=> (a.date||"").localeCompare(b.date||""));
    const tb = $("ex_list");
    tb.innerHTML = "";
    for (const x of items) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${x.date}</td>
        <td>${escapeHtml(x.note || "")}</td>
        <td class="right">${money(x.amt)}</td>
        <td class="right">
          <button class="btn-ghost" type="button" data-e="${x.id}">編輯</button>
          <button class="btn-danger" type="button" data-d="${x.id}">刪除</button>
        </td>`;
      tb.appendChild(tr);
    }
    tb.querySelectorAll("[data-e]").forEach(b => b.onclick = () => startEditExp(b.getAttribute("data-e")));
    tb.querySelectorAll("[data-d]").forEach(b => b.onclick = () => delExp(b.getAttribute("data-d")));
  }
  function startEditExp(id) {
    const arr = load(KEY.EXP, []);
    const x = arr.find(i => i.id === id);
    if (!x) return;
    editExpId = id;
    $("ex_date").value = x.date;
    $("ex_amt").value = x.amt;
    $("ex_note").value = x.note || "";
    $("ex_save").textContent = "更新支出";
    $("ex_cancel").style.display = "block";
  }
  function cancelEditExp() {
    editExpId = null;
    $("ex_amt").value = "";
    $("ex_note").value = "";
    $("ex_save").textContent = "新增支出";
    $("ex_cancel").style.display = "none";
  }
  function saveExp() {
    const ym = getYM();
    const date = $("ex_date").value || todayISO();
    const amt = Math.round(Number($("ex_amt").value || 0));
    const note = ($("ex_note").value || "").trim();
    const arr = load(KEY.EXP, []);
    if (editExpId) {
      const i = arr.findIndex(x => x.id === editExpId);
      if (i >= 0) arr[i] = { ...arr[i], ym, date, amt, note };
      cancelEditExp();
    } else {
      arr.push({ id: uid(), ym, date, amt, note });
      $("ex_amt").value = "";
      $("ex_note").value = "";
    }
    save(KEY.EXP, arr);
    renderAll();
  }
  function delExp(id) {
    save(KEY.EXP, load(KEY.EXP, []).filter(x => x.id !== id));
    if (editExpId === id) cancelEditExp();
    renderAll();
  }

  // ---- income ----
  function switchIncomeUI() {
    const t = $("in_type").value;
    $("box_shopee").style.display = (t === "shopee") ? "block" : "none";
    $("box_other").style.display  = (t === "other")  ? "block" : "none";
    renderShopeePreview();
  }
  function renderShopeePreview() {
    if ($("in_type").value !== "shopee") { $("sh_preview").textContent = ""; return; }
    const s = loadSettings();
    const c = calcShopee($("sh_hours").value, $("sh_bonus").value, $("sh_rate").value, s);
    $("sh_preview").innerHTML =
      `應領 ${money(c.gross)} / 扣：勞保 ${money(c.labor)}、就保 ${money(c.emp)}、團保 ${money(c.group)}、行政 ${money(c.admin)} / <b>實領 ${money(c.net)}</b>`;
  }

  function renderIncomes() {
    const ym = getYM();
    const items = load(KEY.INC, []).filter(x => x.ym === ym);
    const tb = $("in_list");
    tb.innerHTML = "";
    for (const x of items) {
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${x.type}</td>
        <td>${escapeHtml(x.note || "")}</td>
        <td class="right">${money(x.amt)}</td>
        <td class="right">
          <button class="btn-ghost" type="button" data-ie="${x.id}">編輯</button>
          <button class="btn-danger" type="button" data-id="${x.id}">刪除</button>
        </td>`;
      tb.appendChild(tr);
    }
    tb.querySelectorAll("[data-ie]").forEach(b => b.onclick = () => startEditInc(b.getAttribute("data-ie")));
    tb.querySelectorAll("[data-id]").forEach(b => b.onclick = () => delInc(b.getAttribute("data-id")));
  }

  function startEditInc(id) {

function normalizeText(s) {
  return String(s || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g,""); // 去空白
}

function guessCategory(note) {
  const rules = loadCatRules();
  const raw = String(note || "").trim();
  const t = normalizeText(raw);
  if (!t) return { item: "未填", cat: "其他" };

  // 1) 使用者自訂最優先
  for (const k in rules.map) {
    if (normalizeText(k) && t.includes(normalizeText(k))) {
      return { item: k, cat: rules.map[k] };
    }
  }

  // 2) 先判店家（更像記帳App）
  for (const mcat in rules.merchants) {
    const kws = rules.merchants[mcat] || [];
    for (const kw of kws) {
      if (t.includes(normalizeText(kw))) {
        // 便利商店通常算餐飲/採買，看有沒有更明顯品項
        if (mcat === "咖啡店") return { item: kw, cat: "飲料咖啡" };
        if (mcat === "外送平台") return { item: kw, cat: "外送" };
        if (mcat === "超市賣場") return { item: kw, cat: "採買日用品" };
        if (mcat === "便利商店") return { item: kw, cat: "餐飲外食" };
      }
    }
  }

  // 3) 再判分類詞庫
  for (const cat in rules.dict) {
    const kws = rules.dict[cat] || [];
    for (const kw of kws) {
      if (kw && t.includes(normalizeText(kw))) {
        // item 用原字串中的關鍵詞（便於統計）
        return { item: kw, cat };
      }
    }
  }

  // 4) 都不命中：取前 8 字當 item
  const item = raw.split(/[\s,，\/\-#]/).filter(Boolean)[0] || raw.slice(0,8);
  return { item: item.slice(0,12), cat: "其他" };
}

  if (pieCtx) {
    pieChart?.destroy();
    pieChart = new Chart(pieCtx, {
      type: "pie",
      data: {
        labels: Object.keys(pieData),
        datasets: [{ data: Object.values(pieData) }]
      },
      options: { plugins:{ legend:{ position:"bottom" } } }
    });
  }

  // ---- 長條圖：收入 vs 支出 vs 固定 ----
  const incSum = incomes.reduce((a,b)=>a+b.amt,0);
  const expSum = expenses.reduce((a,b)=>a+b.amt,0);
  const fixSum = fixed
    .filter(f => f.enabled !== false && f.paidYms?.includes(ym))
    .reduce((a,b)=>a+b.amt,0);

  const barCtx = document.getElementById("chart_bar");
  if (barCtx) {
    barChart?.destroy();
    barChart = new Chart(barCtx, {
      type: "bar",
      data: {
        labels: ["收入","支出","固定(已繳)"],
        datasets: [{
          data: [incSum, expSum, fixSum]
        }]
      },
      options: {
        plugins:{ legend:{ display:false } },
        scales:{ y:{ beginAtZero:true } }
      }
    });
  }
}

  init();
  
})();
</script>
  <div class="card" style="margin-top:12px">
  <h2>圖表分析</h2>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
    <div>
      <div class="small">支出分類圓餅圖</div>
      <canvas id="chart_pie" height="240"></canvas>
    </div>
    <div>
      <div class="small">收支比較長條圖</div>
      <canvas id="chart_bar" height="240"></canvas>
    </div>
  </div>
</div>
  
</body>
</html>
