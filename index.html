<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>記帳（CSS 分頁版）</title>
  <style>
    :root { --bg:#0b1020; --card:#121a33; --text:#e9eeff; --muted:#aab3d6; --line:#243055; --accent:#7aa2ff; }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif; background:linear-gradient(180deg,#070b17,#0b1020); color:var(--text); }
    .wrap{ max-width:980px; margin:0 auto; padding:18px; }
    h1{ margin:0 0 12px; font-size:20px; }
    /* Tabs (pure CSS) */
    .tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 14px; }
    .tabs label{
      padding:9px 12px; border-radius:999px; border:1px solid var(--line);
      background:rgba(255,255,255,.02); color:var(--text); cursor:pointer; user-select:none;
    }
    input[name="tab"]{ position:absolute; left:-9999px; }
    /* Active tab style */
    #t-expense:checked ~ .tabs label[for="t-expense"],
    #t-income:checked  ~ .tabs label[for="t-income"],
    #t-loans:checked   ~ .tabs label[for="t-loans"],
    #t-settings:checked~ .tabs label[for="t-settings"]{
      border-color:rgba(122,162,255,.7);
      background:rgba(122,162,255,.12);
    }

    /* Panels */
    .panel{ display:none; }
    #t-expense:checked ~ .panels #p-expense{ display:block; }
    #t-income:checked  ~ .panels #p-income{ display:block; }
    #t-loans:checked   ~ .panels #p-loans{ display:block; }
    #t-settings:checked~ .panels #p-settings{ display:block; }

    .card{ background:rgba(18,26,51,.85); border:1px solid var(--line); border-radius:14px; padding:16px; }
    .muted{ color:var(--muted); font-size:12px; }
    .kpi{ margin-top:12px; padding:12px; border-radius:12px; border:1px dashed rgba(122,162,255,.35); background:rgba(122,162,255,.08); }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>記帳（純 CSS 分頁測試）</h1>
    <div class="muted">請先測試：點「收入 / 貸款 / 設定」會不會切換頁面。</div>

    <!-- radios -->
    <input id="t-expense" name="tab" type="radio" checked>
    <input id="t-income" name="tab" type="radio">
    <input id="t-loans" name="tab" type="radio">
    <input id="t-settings" name="tab" type="radio">

    <!-- tab buttons -->
    <div class="tabs">
      <label for="t-expense">支出記帳</label>
      <label for="t-income">收入/薪資</label>
      <label for="t-loans">貸款/固定繳費</label>
      <label for="t-settings">設定</label>
    </div>

    <!-- panels -->
    <div class="panels">
      <section id="p-expense" class="panel">
        <div class="card">
          <h2 style="margin:0 0 6px;font-size:16px;">支出記帳</h2>
          <div class="kpi">✅ 如果你能看到這個區塊，代表「支出」分頁正常。</div>
        </div>
      </section>

      <section id="p-income" class="panel">
        <div class="card">
          <h2 style="margin:0 0 6px;font-size:16px;">收入/薪資</h2>
          <div class="kpi">✅ 如果你能切到這裡，代表「收入」按鈕可按、頁面可切換。</div>
        </div>
      </section>

      <section id="p-loans" class="panel">
        <div class="card">
          <h2 style="margin:0 0 6px;font-size:16px;">貸款/固定繳費</h2>
          <div class="kpi">✅ 如果你能切到這裡，代表「貸款」按鈕可按、頁面可切換。</div>
        </div>
      </section>

      <section id="p-settings" class="panel">
        <div class="card">
          <h2 style="margin:0 0 6px;font-size:16px;">設定</h2>
          <div class="kpi">✅ 如果你能切到這裡，代表「設定」按鈕可按、頁面可切換。</div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
